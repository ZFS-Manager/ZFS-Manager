# Standalone crate (not part of the root workspace) — it targets wasm32-wasip2.
[workspace]

[package]
name = "zfs-dashboard-module-immich"
version = "1.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "=0.46.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[profile.release]
opt-level = "s"
lto = true
strip = true
