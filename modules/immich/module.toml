id = "immich"
name = "Immich Stats"
version = "1.0.0"
author = "ZFS Dashboard"
description = "Collects statistics from an Immich server (photos, videos, storage usage, user count) and stores them as dashboard metrics."
icon = "camera"
repository_url = "https://github.com/ZFS-Manager/ZFS-Manager"
wasm_entrypoint = "immich.wasm"

[permissions]
# The Immich host itself is allowed automatically via the url-typed
# `immich_url` config field; no static entries needed.
network_allowlist = []

[[config_schema]]
key = "immich_url"
label = "Immich URL"
type = "url"
required = true
description = "Base URL of your Immich server, e.g. http://immich.local:2283"

[[config_schema]]
key = "immich_api_key"
label = "Immich API Key"
type = "secret"
required = true
description = "API key created in Immich under Account Settings > API Keys"

[[config_schema]]
key = "stats_to_fetch"
label = "Statistics to collect"
type = "multiselect"
options = ["photos", "videos", "usage", "users"]
default = ["photos", "videos", "usage", "users"]
description = "Which metrics to write on every run"

[[config_schema]]
key = "schedule"
label = "Schedule"
type = "schedule"
default = "15m"
description = "Interval (e.g. 300, 15m, 2h) or cron expression (e.g. 0 0 * * * *)"
