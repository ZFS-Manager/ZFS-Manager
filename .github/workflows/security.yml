name: Security

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2.62.0
        with:
          tool: cargo-deny@0.20.2

      # cargo-deny's `advisories` check (see rust-backend/deny.toml) covers the
      # RustSec database and yanked crates — the same ground `cargo audit` does,
      # without the older audit releases' CVSS-4.0 parse failure.
      - name: cargo deny
        run: cargo deny --manifest-path rust-backend/Cargo.toml check
